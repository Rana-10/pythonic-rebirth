[tool.poetry]
package-mode = false

[project]
name = "pythonic_rebirth"
version = "3.0.4"
description = "Latest Pandas version at this moment"
authors = [
    { name = "Muhammad Azmat", email = "muhammadazmat018@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.15,!=3.14.1"
dependencies = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pandas-stubs (>=3.0.3,<3.1.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "kagglehub (>=1.0.2,<2.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "flask (>=3.1.3,<4.0.0)",
    "flask-scss (>=0.5,<0.6)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)",
    "tensorflow (>=2.21.0,<3.0.0)",
    "xgboost (>=3.3.0,<4.0.0)",
    "holidays (>=0.101,<0.102)",
    "airportsdata (>=20260315,<20260316)",
    "meteostat (>=2.1.4,<3.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "arxiv (>=4.0.1,<5.0.0)",
    "sentence-transformers (>=5.7.0,<6.0.0)",
    "transformers (>=5.15.0,<6.0.0)",
    "pypdf (>=6.15.0,<7.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "langchain-mongodb (>=0.11.0,<0.12.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
